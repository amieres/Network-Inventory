RebootRaspi.Config:
  computer: Raspi4
  ipAddress: 192.168.5.60
  user: !secret raspi4_ssh_user
  pwd:  !secret raspi4_ssh_password
  command: sudo reboot
  switch:  switch.kauf_plug   # Kauf_XX smart plug — power-cycled when SSH is unreachable
  offSecs: 10
  autoReboot: false   # 2026-10-02: off while the AC500s are unreadable after their IoT firmware update